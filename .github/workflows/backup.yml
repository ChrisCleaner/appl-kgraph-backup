name: Daily backup of pbl-nl/appl-kgraph

on:
  schedule:
    # Every day at 03:17 UTC
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Snapshot source files onto main
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Get the current files of the source repo's main branch
          git clone --depth 1 --branch main https://github.com/pbl-nl/appl-kgraph.git source
          SRC_SHA=$(git -C source rev-parse HEAD)

          # Get this backup repo; create main if it doesn't exist yet
          git clone "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" backup
          cd backup
          git checkout main 2>/dev/null || git checkout --orphan main

          # Replace all tracked content with the source files
          find . -mindepth 1 -maxdepth 1 -name .git -prune -o -exec rm -rf {} +
          rsync -a --exclude='.git' ../source/ ./

          git add -A
          if git diff --cached --quiet; then
            echo "Source unchanged since last backup - nothing to commit."
          else
            git commit -m "Backup snapshot of pbl-nl/appl-kgraph@${SRC_SHA}"
            git push origin main
          fi
