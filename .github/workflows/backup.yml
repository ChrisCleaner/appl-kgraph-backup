name: Daily backup of pbl-nl/appl-kgraph

on:
  schedule:
    # Every day at 03:17 UTC
    - cron: '13 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Snapshot source files onto main
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git clone --depth 1 "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" backup
          cd backup

          # Current tip of the backup's main branch, if it exists yet
          PARENT=""
          PARENT_TREE=""
          if git fetch --depth 1 origin main; then
            PARENT=$(git rev-parse FETCH_HEAD)
            PARENT_TREE=$(git rev-parse "FETCH_HEAD^{tree}")
          fi

          # Latest state of the source repo's main branch
          git fetch --depth 1 https://github.com/pbl-nl/appl-kgraph.git main
          SRC_SHA=$(git rev-parse FETCH_HEAD)
          SRC_TREE=$(git rev-parse "FETCH_HEAD^{tree}")

          if [ "$SRC_TREE" = "$PARENT_TREE" ]; then
            echo "Source unchanged since last backup - nothing to commit."
          else
            # Record the source's file tree as a new snapshot commit on main.
            # No files are deleted or copied on disk; git derives the changes.
            NEW=$(git commit-tree "$SRC_TREE" ${PARENT:+-p "$PARENT"} \
              -m "Backup snapshot of pbl-nl/appl-kgraph@${SRC_SHA}")
            git push origin "$NEW:refs/heads/main"
          fi
